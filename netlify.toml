# Netlify configuration. Settings here take precedence over the site's UI
# settings, which still pointed at the old Create React App setup.

[build]
  command = "npm run build"
  # Next.js builds to .next, not the CRA-era "build" directory.
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node >= 20.9; Netlify's default image ships Node 18.
  NODE_VERSION = "22"

# Netlify's Next.js runtime: serves the app, handles next/image optimisation
# through the Netlify Image CDN, and wires up caching headers.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-cache the immutable build output.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
