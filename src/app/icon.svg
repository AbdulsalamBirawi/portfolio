<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
  </defs>

  <!-- Deep-space ground -->
  <rect width="64" height="64" rx="14" fill="#06070c" />

  <!-- Orbit, tilted -->
  <ellipse
    cx="32" cy="32" rx="25" ry="11"
    transform="rotate(-28 32 32)"
    fill="none" stroke="#3b82f6" stroke-opacity="0.75" stroke-width="2.5"
  />

  <!-- Planet -->
  <circle cx="32" cy="32" r="12" fill="url(#core)" />

  <!-- Front half of the orbit, drawn over the planet so it reads as 3D -->
  <path
    d="M 9.9 37.6 A 25 11 -28 0 0 54.1 26.4"
    fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"
  />

  <!-- Satellite -->
  <circle cx="54" cy="26" r="3.4" fill="#f8fafc" />
</svg>
